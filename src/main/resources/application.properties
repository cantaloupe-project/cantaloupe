# Spring Boot Configuration for Cantaloupe

# Server configuration
server.port=8182
server.address=0.0.0.0

# Use Jetty as the embedded server (already configured via starter)
server.servlet.context-path=/

# Logging configuration - use Spring Boot defaults
logging.level.root=INFO
logging.level.edu.illinois.library.cantaloupe=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Disable Spring Boot banner
spring.main.banner-mode=off

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true

# Jackson configuration
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.serialization.indent-output=false

# Actuator endpoints (optional - for health checks, metrics, etc.)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Static resources configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=31536000

# Multipart configuration (for file uploads in admin interface)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Error handling
server.error.include-stacktrace=never
server.error.include-message=always
