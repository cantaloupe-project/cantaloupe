# Cantaloupe Spring Boot Application Configuration
# This file provides default Spring Boot configuration that integrates with
# Cantaloupe's existing configuration system.

# Server Configuration
# These will be overridden by Cantaloupe's configuration at runtime
server.port=8182
server.address=0.0.0.0

# Logging Configuration
# Use Cantaloupe's existing logging configuration
logging.config=classpath:logback.xml

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Disable Spring Boot banner in favor of Cantaloupe's startup messages
spring.main.banner-mode=off

# JMX Configuration (align with Cantaloupe's JMX support)
spring.jmx.enabled=true

# Static Resource Handling
# Let our StaticFileController handle /static/** paths
spring.web.resources.add-mappings=false

# Multipart Configuration (for file uploads in admin interface)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Error Handling
# Let Cantaloupe handle its own error pages
server.error.whitelabel.enabled=false

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

# HTTP/2 Support
server.http2.enabled=true

# Connection Timeout
server.jetty.connection-idle-timeout=30s

# Thread Configuration (will be overridden by Cantaloupe config)
server.jetty.threads.max=150
server.jetty.threads.min=8

# Access Log (disabled - Cantaloupe handles its own access logging)
server.jetty.accesslog.enabled=false
