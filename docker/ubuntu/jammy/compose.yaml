#
# N.B.: docker compose must be invoked from the project root directory:
#
# docker compose -f path/to/compose.yaml up --exit-code-from cantaloupe
#
services:
  cantaloupe:
    platform: linux/amd64
    build:
      context: ../../../
      dockerfile: $PWD/docker/ubuntu/jammy/Dockerfile
    ports:
      - "8182:8182"
  seaweedfs:
    image: chrislusf/seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: SeaweedUser
      AWS_SECRET_ACCESS_KEY: OpenSesame
    command: mini -dir=/data
  redis:
    image: redis:alpine
    hostname: redis
